# GPU override for the model server only. Web and worker stay CPU images.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Needs the NVIDIA Container Toolkit on the host.
services:
  models:
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    environment:
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: int8_float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
